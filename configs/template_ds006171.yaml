montage: {source: standard, standard_name: standard_1005, on_missing: raise}
events:
  source: bids_events
  mapping: {mapping}
  unmapped: error
  expected_counts: {}                      # per-subject counts vary; QA in sv-stage instead
preproc:
  # line_noise: eegunify default (REFERENCES §5: neither source states a notch filter)
  resample_hz: 256                         # also equalises sub-35/36, recorded at 2048 Hz
  highpass_hz: 0.1                         # REFERENCES §2 (Eklund)
  lowpass_hz: null                         # REFERENCES §2: measure unfiltered, plot at 30 Hz
  filter: {method: iir, iir_order: 2, phase: zero}
  bad_channels: {method: pyprep_robust}
  interpolate: true
artifacts:
  method: ica
  # Bipolar order (Step 3): kept as recorded, VEOG1-VEOG2 and HEOG1-HEOG2. Which electrode is
  # upper/left could not be settled from the data (DATASETS.md, Step 3 checks), and neither
  # eegunify use depends on the sign: the step rule takes |step| and the ICA EOG match |z|.
  # Signed HEOG plots must not be read as left/right.
  eog_bipolar: {VEOG: [VEOG1, VEOG2], HEOG: [HEOG1, HEOG2]}
  ica:
    fit_exclude: {}                        # Step 7 decides breaks/bursts exclusion if ICA fails
  post_bad_channels: {max_ptp_ratio: 2.0}
epochs:
  sets:
    stim:
      lock: "stimulus/*"
      tmin_ms: -1000                       # -1000..1000: Phase 2 needs >= 500 ms clean prestimulus (alpha)
      tmax_ms: 1000
      baseline_ms: [-100, 0]               # REFERENCES §2 (Eklund)
    stimraw:                               # same epochs, no baseline: Phase 2 input (PHASE2 §4)
      lock: "stimulus/*"
      tmin_ms: -1000
      tmax_ms: 1000
      baseline_ms: null
  reject:
    method: rules
    rules:
      - {test: ptp, channels: [eeg], threshold_uv: 100, win_ms: 200, step_ms: 100}
      # Lateral Gabors: reject horizontal eye movements to the stimulus. 32 uV is a project
      # choice, not a literature value (user decision 5, version A; REFERENCES §5).
      - {test: step, channels: [HEOG], threshold_uv: 32, window_ms: [-50, 350], win_ms: 100, step_ms: 10}
conditions:
  seen:      ["stimulus/seen"]
  unseen:    ["stimulus/unseen"]
  seen_m:    ["stimulus/seen/m1"]
  unseen_m:  ["stimulus/unseen/m1"]
  seen_left:  ["stimulus/seen/left"]
  seen_right: ["stimulus/seen/right"]
  unseen_left:  ["stimulus/unseen/left"]
  unseen_right: ["stimulus/unseen/right"]
  fa: ["stimulus/fa"]
  cr: ["stimulus/cr"]
contrasts:
  seen_minus_unseen:     {plus: seen, minus: unseen}
  seen_minus_unseen_m:   {plus: seen_m, minus: unseen_m}
  fa_minus_cr:           {plus: fa, minus: cr}
  seen_lat:   {type: lateralized, left: seen_left, right: seen_right, pairs: [[O1, O2]],
               contra_wave: seen_contra, ipsi_wave: seen_ipsi}       # REFERENCES §2, §5
  unseen_lat: {type: lateralized, left: unseen_left, right: unseen_right, pairs: [[O1, O2]],
               contra_wave: unseen_contra, ipsi_wave: unseen_ipsi}
components:
  library_paths: [../../configs/components/awareness.yaml]   # resolution checked in Step 5
  preset: awareness
  use: [van, lp]
group:
  tests: [paired_t, wilcoxon]
  cluster:
    enabled: true
    contrast: seen_minus_unseen_m
    tmin_ms: 0
    tmax_ms: 800
    n_permutations: 5000
    tail: 0
  reference_values: none
