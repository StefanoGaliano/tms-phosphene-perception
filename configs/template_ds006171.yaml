# ds006171, task-{task} (Melcon et al. 2024, Psychophysiology 61:e14525, doi 10.1111/psyp.14525;
# OpenNeuro ds006171 v1.0.0, CC0). Events: staged by start_vision.stage (photodiode onsets,
# pre-labelled seen/unseen/FA/CR, contrast-matched tag), read from the staged events.tsv.
# sv-configs fills {task}, {subjects}, {mapping}. Every value cites docs/PHASE1_REFERENCES.md
# (section) or docs/DATASETS.md ("Step 3 checks"). Version A of user decision 5 (HEOG step rule).
